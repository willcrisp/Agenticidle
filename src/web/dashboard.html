<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Idol — Balance Harness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D0F11; --floor:#131619; --pod:#191D21; --pod-2:#1E2227;
  --line:#282D33; --line-soft:#20242A;
  --fg:#C6CBD1; --fg-2:#878E96; --dim:#5A616A; --faint:#383E45;
  --run:#5F807A; --ok:#78906C; --fail:#A5605A; --idle:#AC9463; --tok:#6B8598;
  --px:"Silkscreen","JetBrains Mono",monospace;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --sans:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:13px;
  -webkit-font-smoothing:antialiased}

.bar{position:sticky;top:0;z-index:20;height:62px;background:#101317;
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:22px;padding:0 20px}
.mark{font-family:var(--px);font-size:14px;letter-spacing:.06em;color:#D3D9DE;line-height:1.5}
.mark span{display:block;font-size:8px;color:var(--faint);letter-spacing:.16em}
.bar .sp{margin-left:auto}
button{font-family:var(--px);font-size:11px;padding:11px 16px;line-height:1;cursor:pointer;
  border:1px solid var(--line);background:#151A1E;color:var(--fg-2)}
button:hover{border-color:var(--fg-2);color:var(--fg)}
button.go{border-color:var(--ok);color:var(--ok);background:#161B15}
button.go:hover{background:#1B221A}
button:focus-visible{outline:2px solid var(--tok);outline-offset:2px}
.runsIn{width:64px;background:#0D1114;border:1px solid var(--line);color:var(--fg);
  font-family:var(--mono);font-size:12px;padding:9px 8px}
label.inl{font-family:var(--px);font-size:9px;letter-spacing:.12em;color:var(--faint)}

.prog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--ok);width:0;
  transition:width .12s linear}

main{display:grid;grid-template-columns:minmax(300px,368px) 1fr;align-items:start;gap:0}
@media (max-width:940px){main{grid-template-columns:1fr}}

/* ---- levers ---- */
aside{border-right:1px solid var(--line);background:var(--floor);
  max-height:calc(100vh - 62px);overflow-y:auto;position:sticky;top:62px}
.grp{border-bottom:1px solid var(--line-soft)}
.grp>h3{font-family:var(--px);font-size:9.5px;letter-spacing:.14em;color:var(--fg-2);
  padding:14px 16px 12px;background:var(--pod-2);cursor:pointer;display:flex;gap:8px;align-items:center}
.grp>h3::before{content:"−";color:var(--faint);font-size:11px;width:9px}
.grp.shut>h3::before{content:"+"}
.grp.shut .body{display:none}
.body{padding:6px 16px 16px}
.lv{padding:9px 0}
.lv-t{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px}
.lv-t b{font-family:var(--sans);font-size:11.5px;font-weight:400;color:var(--fg-2)}
.lv-t i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--fg)}
.lv-h{font-family:var(--sans);font-size:10.5px;color:var(--faint);line-height:1.45;margin-top:6px}
input[type=range]{width:100%;height:16px;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:#0D1114;border:1px solid var(--line)}
input[type=range]::-moz-range-track{height:3px;background:#0D1114;border:1px solid var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:15px;
  background:var(--tok);margin-top:-7px;border:0}
input[type=range]::-moz-range-thumb{width:11px;height:15px;background:var(--tok);border:0;border-radius:0}
input[type=range]:focus-visible{outline:2px solid var(--tok);outline-offset:3px}
select{width:100%;background:#0D1114;border:1px solid var(--line);color:var(--fg);
  font-family:var(--mono);font-size:12px;padding:7px 8px}
.chk{display:flex;align-items:center;gap:9px;padding:8px 0;cursor:pointer}
.chk input{accent-color:var(--tok);width:14px;height:14px}
.chk span{font-family:var(--sans);font-size:11.5px;color:var(--fg-2)}

/* ---- results ---- */
section{padding:20px 22px 70px;min-width:0}
.card{border:1px solid var(--line);background:var(--pod);margin-bottom:18px}
.card h2{font-family:var(--px);font-size:10px;letter-spacing:.14em;color:var(--fg-2);
  padding:13px 16px;border-bottom:1px solid var(--line-soft);background:var(--pod-2)}
.card .in{padding:16px}
.sub{font-family:var(--sans);font-size:11.5px;color:var(--dim);line-height:1.55;margin-bottom:14px}

table{width:100%;border-collapse:collapse;font-size:12px}
th{font-family:var(--px);font-size:8px;letter-spacing:.1em;color:var(--faint);
  text-align:right;padding:0 0 10px;font-weight:400;white-space:nowrap}
th:first-child{text-align:left}
td{padding:8px 0;border-top:1px solid var(--line-soft);text-align:right;
  font-variant-numeric:tabular-nums;white-space:nowrap}
td:first-child{text-align:left;font-family:var(--sans);font-size:12px;color:var(--fg)}
td.m{color:var(--ok)} td.neg{color:var(--fail)} td.d{color:var(--dim)}
tr.best td:first-child::after{content:" ◄";color:var(--ok);font-family:var(--mono)}

canvas{display:block;width:100%;image-rendering:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;
  font-family:var(--px);font-size:8px;letter-spacing:.1em;color:var(--faint)}
.legend i{display:inline-block;width:9px;height:9px;margin-right:6px;vertical-align:-1px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;background:var(--line-soft)}
.tile{background:var(--pod);padding:14px 15px}
.tile b{display:block;font-family:var(--px);font-size:8px;letter-spacing:.1em;color:var(--faint);margin-bottom:9px}
.tile i{font-style:normal;font-family:var(--px);font-size:17px;color:var(--fg)}
.tile s{display:block;text-decoration:none;font-family:var(--sans);font-size:10.5px;
  color:var(--dim);margin-top:7px;line-height:1.4}
.tile.warn i{color:var(--fail)} .tile.good i{color:var(--ok)}

.flags{display:flex;flex-direction:column;gap:1px;background:var(--line-soft)}
.flag{background:var(--pod);padding:13px 15px;display:flex;gap:12px;align-items:flex-start}
.flag b{font-family:var(--px);font-size:8.5px;letter-spacing:.08em;flex:none;width:66px;padding-top:2px}
.flag p{font-family:var(--sans);font-size:11.5px;line-height:1.55;color:var(--fg-2)}
.flag.bad b{color:var(--fail)} .flag.warn b{color:var(--idle)} .flag.ok b{color:var(--ok)}

.empty{padding:60px 20px;text-align:center;font-family:var(--sans);font-size:12.5px;color:var(--dim)}
.spin{color:var(--faint);font-family:var(--px);font-size:9px;letter-spacing:.14em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="bar">
  <div class="mark">AGENT IDOL<span>BALANCE HARNESS</span></div>
  <label class="inl">RUNS EACH</label>
  <input class="runsIn" id="runs" type="number" value="60" min="10" max="600" step="10">
  <button class="go" id="go">RUN SIMULATION</button>
  <span class="spin" id="spin"></span>
  <div class="sp"></div>
  <button id="reset">RESET LEVERS</button>
  <button id="copy">COPY CONFIG</button>
  <div class="prog" id="prog"></div>
</div>

<main>
  <aside id="levers"></aside>
  <section id="out">
    <div class="card"><div class="empty">Move levers, press Run. Every number below comes from full 30-minute runs simulated at 30Hz with seeded RNG — same seed, same result.</div></div>
  </section>
</main>

<script>/*SIM_BUNDLE*/</script>
<script>
const S = window.AgentIdolSim;
const money = n => (n<0?"-$":"$") + Math.abs(Math.round(n)).toLocaleString();
const pct = n => (n*100).toFixed(0) + "%";
let cfg = S.cloneConfig(S.DEFAULT_CONFIG);

/* ---------------------------------------------------------------- levers */
const LEVERS = [
  ["The run", [
    ["runSeconds","Run length",300,3600,60,v=>(v/60)+" min","The clock is the whole design. 20 or 45 minutes reshapes every phase."],
    ["startingCash","Starting cash",0,40000,500,money,"Fixed every run so scores stay comparable."],
    ["startingCredits","Starting credits",0,6000,100,String,"How long you can operate before the first block purchase."],
    ["maxRoster","Roster cap",4,40,1,String,"How many bodies the floor can hold. Drives peak click load."],
    ["podCount","Pods",2,8,1,String,null],
    ["boardSlots","Board slots",1,6,1,String,null],
  ]],
  ["Agents", [
    ["classes.starter.runWork","Starter run length",2,30,1,v=>v+"s","Work-seconds per run. Also the size of the slice it lands."],
    ["classes.starter.oneShot","Starter one-shot",0.2,1,0.01,pct,null],
    ["classes.senior.runWork","Senior run length",2,40,1,v=>v+"s",null],
    ["classes.senior.oneShot","Senior one-shot",0.2,1,0.01,pct,null],
    ["classes.elite.runWork","Elite run length",2,60,1,v=>v+"s",null],
    ["classes.elite.oneShot","Elite one-shot",0.2,1,0.01,pct,null],
    ["classes.senior.burnMult","Senior burn ×",0.5,3,0.05,v=>v.toFixed(2)+"×",null],
    ["classes.elite.burnMult","Elite burn ×",0.5,3,0.05,v=>v.toFixed(2)+"×","Hiring is free — burn rate and crowding are the whole class ladder now."],
  ]],
  ["Projects", [
    ["sizes.small.work","Small job work",10,200,5,v=>v+"s",null],
    ["sizes.medium.work","Medium job work",20,400,10,v=>v+"s",null],
    ["sizes.large.work","Large job work",50,800,10,v=>v+"s",null],
    ["sizes.huge.work","Huge job work",100,1600,25,v=>v+"s","Huge jobs late are the pro-rata trap. Watch what happens if you raise this."],
    ["sizes.small.payoutPerWork","Small $ per work",1,80,1,v=>"$"+v,null],
    ["sizes.medium.payoutPerWork","Medium $ per work",1,80,1,v=>"$"+v,null],
    ["sizes.large.payoutPerWork","Large $ per work",1,80,1,v=>"$"+v,null],
    ["sizes.huge.payoutPerWork","Huge $ per work",1,80,1,v=>"$"+v,null],
    ["difficulty.penaltyPerPip","Difficulty penalty / pip",0,0.22,0.005,pct,"Subtracted from one-shot per pip above 1. This is what makes quality matter separately from count."],
    ["difficulty.floor","One-shot floor",0.02,0.5,0.01,pct,null],
    ["crowding.penaltyPerExtraAgent","Crowding penalty / extra agent",0,0.2,0.005,pct,"Subtracted from one-shot per agent stacked on a pod beyond the first, on top of the difficulty penalty. The brake on free hiring — swarming still works, but every extra body makes everyone on the pod worse."],
    ["hallucination.tierThresholds.0","Hallucination: LOW→MEDIUM at",0.05,0.5,0.01,pct,"Fail-rate band edges for the HALLUCINATION readout on the pod card. Below this, it reads LOW."],
    ["hallucination.tierThresholds.1","Hallucination: MEDIUM→HIGH at",0.1,0.7,0.01,pct,null],
    ["hallucination.tierThresholds.2","Hallucination: HIGH→VERY HIGH at",0.2,0.85,0.01,pct,null],
    ["hallucination.tierThresholds.3","Hallucination: VERY HIGH→EXTREME at",0.3,0.95,0.01,pct,"Above this, it reads EXTREME. Keep all four ascending or the bands stop making sense."],
  ]],
  ["Decay", [
    ["decay.perSecond","Decay per second",0.0002,0.02,0.0002,v=>(v*100).toFixed(2)+"%","Fraction of the original offer lost every second once accepted."],
    ["decay.floor","Decay floor",0,0.6,0.01,pct,"A contract never falls below this share of its offer."],
    ["decay.sizeDamping","Big-job damping",0,1,0.05,v=>v.toFixed(2),"Larger jobs decay slower, since they take longer by nature."],
  ]],
  ["Credits", [
    ["credits.burnPerAgentSecond","Burn / agent / sec",0.2,12,0.1,v=>v.toFixed(1),"At MEDIUM reasoning, before class and reasoning multipliers."],
    ["reasoning.low.speed","LOW speed ×",0.2,1,0.05,v=>v.toFixed(2)+"×",null],
    ["reasoning.low.burn","LOW burn ×",0.1,1,0.05,v=>v.toFixed(2)+"×",null],
    ["reasoning.high.speed","HIGH speed ×",1,4,0.1,v=>v.toFixed(1)+"×",null],
    ["reasoning.high.burn","HIGH burn ×",1,6,0.1,v=>v.toFixed(1)+"×","The central tension: is the decay you avoid worth the credits you burn?"],
    ["credits.priceDropPerDelivery","Price drop / delivery",0,0.1,0.005,v=>(v*100).toFixed(1)+"%","Token prices fall as you deliver. The engine-building payoff."],
    ["credits.priceFloorMult","Price floor",0.1,1,0.05,v=>v.toFixed(2)+"×",null],
  ]],
  ["Debt", [
    ["debt.interestPerSecond","Interest / sec",0,0.003,0.0001,v=>(v*100).toFixed(3)+"%",null],
    ["debt.lowLockAt","LOW lock at",-40000,0,500,money,"Below this, every pod is forced down to LOW reasoning — the punishment that makes decay eat you faster."],
    ["debt.repoAt","Repossess at",-100000,0,1000,money,null],
    ["debt.repoIntervalSeconds","Repossess every",5,120,5,v=>v+"s",null],
  ]],
  ["Escalation", [
    ["escalation.payoutEndMult","Payout by the end",1,8,0.1,v=>v.toFixed(1)+"×","The board gets richer over the run."],
    ["escalation.difficultyStart","Difficulty at start",1,5,0.1,v=>v.toFixed(1)+" pips",null],
    ["escalation.difficultyEnd","Difficulty at end",1,5,0.1,v=>v.toFixed(1)+" pips","...and harder at the same time. This is the main tuning knob."],
    ["escalation.steps","Steps (stepped only)",2,12,1,String,null],
    ["escalation.deliveriesToMax","Deliveries to max diff.",5,100,1,String,"Escalation also runs off deliveries banked, independent of the clock — whichever is further along wins. A prolific player gets outrun by their own pace."],
  ]],
  ["The player", [
    ["_cps","Clicks per second",0.5,8,0.1,v=>v.toFixed(1)+"/s","How fast a human can actually serve blocked agents. Everything about overwhelm hangs off this."],
    ["_reaction","Reaction time",0,2,0.05,v=>v.toFixed(2)+"s",null],
  ]],
];

const RULES = [
  ["escalation.shape","Escalation curve",["linear","stepped","accelerating"]],
];
const FLAGS = [
  ["credits.blockedAgentsBurn","Blocked agents keep burning credits","Undecided in the handover. If off, ignoring a red agent costs only opportunity."],
  ["failedRunsCostCredits","Failed runs still cost their credits",null],
  ["discardOverflow","Discard slice overflow past 100%","A second, throughput-side crowding cost on top of crowding.penaltyPerExtraAgent's one-shot penalty. Stacking both may be too much brake at once — watch for it."],
];

let player = { cps: 2.5, reaction: 0.35 };

const get = (o,path) => path.split(".").reduce((a,k)=>a[k],o);
const set = (o,path,v) => { const ks=path.split("."); const last=ks.pop();
  ks.reduce((a,k)=>a[k],o)[last]=v; };

function buildLevers(){
  const root = document.getElementById("levers");
  root.innerHTML = "";
  LEVERS.forEach(([title, items], gi) => {
    const g = document.createElement("div");
    g.className = "grp" + (gi>0 && gi<7 ? " shut" : "");
    const h = document.createElement("h3"); h.textContent = title; h.tabIndex = 0;
    h.onclick = () => g.classList.toggle("shut");
    h.onkeydown = e => { if(e.key==="Enter"||e.key===" "){e.preventDefault();g.classList.toggle("shut");} };
    g.appendChild(h);
    const body = document.createElement("div"); body.className = "body";
    items.forEach(([path,label,min,max,step,fmt,help]) => {
      const cur = path==="_cps" ? player.cps : path==="_reaction" ? player.reaction : get(cfg,path);
      const w = document.createElement("div"); w.className = "lv";
      w.innerHTML = `<div class="lv-t"><b>${label}</b><i>${fmt(cur)}</i></div>`;
      const r = document.createElement("input");
      r.type="range"; r.min=min; r.max=max; r.step=step; r.value=cur;
      r.setAttribute("aria-label", label);
      r.oninput = () => {
        const v = parseFloat(r.value);
        w.querySelector("i").textContent = fmt(v);
        if(path==="_cps") player.cps=v;
        else if(path==="_reaction") player.reaction=v;
        else set(cfg,path,v);
      };
      w.appendChild(r);
      if(help){ const p=document.createElement("div"); p.className="lv-h"; p.textContent=help; w.appendChild(p); }
      body.appendChild(w);
    });
    if(title==="Escalation"){
      RULES.forEach(([path,label,opts])=>{
        const w=document.createElement("div"); w.className="lv";
        w.innerHTML=`<div class="lv-t"><b>${label}</b></div>`;
        const sel=document.createElement("select");
        sel.setAttribute("aria-label",label);
        opts.forEach(o=>{const op=document.createElement("option");op.value=o;op.textContent=o;
          if(get(cfg,path)===o)op.selected=true;sel.appendChild(op);});
        sel.onchange=()=>set(cfg,path,sel.value);
        w.appendChild(sel); body.appendChild(w);
      });
    }
    if(title==="Credits"){
      FLAGS.forEach(([path,label,help])=>{
        const l=document.createElement("label"); l.className="chk";
        const c=document.createElement("input"); c.type="checkbox"; c.checked=get(cfg,path);
        c.onchange=()=>set(cfg,path,c.checked);
        const sp=document.createElement("span"); sp.textContent=label;
        l.appendChild(c); l.appendChild(sp); body.appendChild(l);
        if(help){const p=document.createElement("div");p.className="lv-h";p.textContent=help;body.appendChild(p);}
      });
    }
    g.appendChild(body); root.appendChild(g);
  });
}
buildLevers();

/* ------------------------------------------------------------- charts */
function chart(canvas, series, opts={}){
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = opts.height || 190;
  canvas.width = w*dpr; canvas.height = h*dpr; canvas.style.height = h+"px";
  const g = canvas.getContext("2d"); g.scale(dpr,dpr);
  const padL=46,padR=10,padT=10,padB=22;
  const iw=w-padL-padR, ih=h-padT-padB;
  const maxY = opts.max || Math.max(0.001,...series.flatMap(s=>s.data));
  const n = Math.max(...series.map(s=>s.data.length));
  const X = i => padL + (i/(n-1))*iw;
  const Y = v => padT + ih - (v/maxY)*ih;

  g.strokeStyle="#20242A"; g.lineWidth=1; g.font='9px "JetBrains Mono",monospace';
  g.fillStyle="#5A616A"; g.textAlign="right";
  for(let k=0;k<=4;k++){
    const v=maxY*k/4, y=Math.round(Y(v))+0.5;
    g.beginPath(); g.moveTo(padL,y); g.lineTo(w-padR,y); g.stroke();
    g.fillText(opts.fmtY?opts.fmtY(v):v.toFixed(1), padL-7, y+3);
  }
  g.textAlign="left"; g.fillText(opts.xLeft||"0", padL, h-7);
  g.textAlign="right"; g.fillText(opts.xRight||"", w-padR, h-7);

  if(opts.threshold!=null && opts.threshold<=maxY){
    const y=Math.round(Y(opts.threshold))+0.5;
    g.setLineDash([4,4]); g.strokeStyle="#A5605A"; g.beginPath();
    g.moveTo(padL,y); g.lineTo(w-padR,y); g.stroke(); g.setLineDash([]);
    g.fillStyle="#A5605A"; g.textAlign="left";
    g.fillText(opts.thresholdLabel||"", padL+4, y-5);
  }

  series.forEach(s=>{
    if(s.fill){
      g.beginPath(); g.moveTo(X(0),Y(0));
      s.data.forEach((v,i)=>g.lineTo(X(i),Y(v)));
      g.lineTo(X(s.data.length-1),Y(0)); g.closePath();
      g.fillStyle=s.fill; g.fill();
    }
    g.beginPath();
    s.data.forEach((v,i)=> i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));
    g.strokeStyle=s.color; g.lineWidth=s.width||1.6; g.stroke();
  });
}

function histogram(canvas, values, opts={}){
  const dpr=window.devicePixelRatio||1;
  const w=canvas.clientWidth,h=opts.height||160;
  canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.height=h+"px";
  const g=canvas.getContext("2d");g.scale(dpr,dpr);
  const padL=8,padR=8,padT=8,padB=24;
  const iw=w-padL-padR, ih=h-padT-padB;
  const min=Math.min(...values), max=Math.max(...values);
  const bins=Math.min(34,Math.max(8,Math.floor(values.length/6)));
  const counts=new Array(bins).fill(0);
  values.forEach(v=>{const b=Math.min(bins-1,Math.floor(((v-min)/Math.max(1e-9,max-min))*bins));counts[b]++;});
  const mx=Math.max(...counts);
  const bw=iw/bins;
  counts.forEach((c,i)=>{
    const bh=(c/mx)*ih;
    const centre=min+((i+0.5)/bins)*(max-min);
    g.fillStyle = centre<0 ? "#A5605A" : "#78906C";
    g.fillRect(padL+i*bw+0.5, padT+ih-bh, Math.max(1,bw-1.5), bh);
  });
  g.font='9px "JetBrains Mono",monospace'; g.fillStyle="#5A616A";
  g.textAlign="left"; g.fillText(money(min), padL, h-8);
  g.textAlign="right"; g.fillText(money(max), w-padR, h-8);
  g.textAlign="center"; g.fillStyle="#878E96";
  g.fillText("median " + money(values[Math.floor(values.length/2)]), w/2, h-8);
}

/* ------------------------------------------------------------- running */
const sleep = ms => new Promise(r=>setTimeout(r,ms));

async function run(){
  const runs = Math.max(10, Math.min(600, parseInt(document.getElementById("runs").value)||60));
  const btn=document.getElementById("go"); btn.disabled=true; btn.textContent="RUNNING…";
  const prog=document.getElementById("prog"); const spin=document.getElementById("spin");
  const strats = S.STRATEGIES.map(s=>({...s, clicksPerSecond:player.cps, reactionSeconds:player.reaction}));
  const results=[];
  for(let i=0;i<strats.length;i++){
    spin.textContent = strats[i].name.toUpperCase();
    prog.style.width = ((i/strats.length)*100)+"%";
    await sleep(16);
    results.push(S.batch(cfg, strats[i], runs, "d"+i));
  }
  // score samples for the histogram, from the first strategy
  const samples=[];
  for(let i=0;i<Math.min(runs,240);i++) samples.push(S.simulateRun(cfg,strats[0],"h-"+i).score);
  samples.sort((a,b)=>a-b);

  prog.style.width="100%"; spin.textContent="";
  render(results, samples, runs);
  btn.disabled=false; btn.textContent="RUN SIMULATION";
  await sleep(300); prog.style.width="0%";
}

function diagnose(rows, cfg){
  const out=[]; const b=rows[0];
  const best=[...rows].sort((x,y)=>y.median-x.median)[0];
  const spread = best.median>0 ? (best.p90-best.p10)/best.median : 0;
  const peak = Math.max(...b.demandCurve);
  const early = b.demandCurve.slice(0, Math.floor(b.demandCurve.length*0.25));
  const late = b.demandCurve.slice(Math.floor(b.demandCurve.length*0.75));
  const earlyAvg = early.reduce((a,c)=>a+c,0)/early.length;
  const lateAvg = late.reduce((a,c)=>a+c,0)/late.length;
  const ramp = earlyAvg>0.001 ? lateAvg/earlyAvg : 99;

  if(peak < player.cps*0.75)
    out.push(["bad","NO OVERWHELM","Peak demand is "+peak.toFixed(2)+" clicks/s against a "+player.cps.toFixed(1)+"/s player. The game never runs out of your hands, so 'you are the bottleneck' isn't true at these numbers. Raise the roster cap, shorten run lengths, or lower one-shot."]);
  else if(b.clickServeRate < 0.75)
    out.push(["ok","OVERWHELM","Only "+pct(b.clickServeRate)+" of clicks get served and blocked agents wait "+b.meanBlockedWait.toFixed(1)+"s. The floor is genuinely outrunning the player."]);
  else
    out.push(["warn","TIGHT","Peak demand "+peak.toFixed(2)+"/s versus a "+player.cps.toFixed(1)+"/s cap. Pressure is close but the player is still keeping up."]);

  if(ramp < 1.6)
    out.push(["warn","FLAT RAMP","Late-run click demand is only "+ramp.toFixed(1)+"× the opening. The escalation the design promises isn't showing up in the input load."]);
  else
    out.push(["ok","ESCALATION","Click demand rises "+ramp.toFixed(1)+"× from the first quarter to the last."]);

  const control = rows.find(r=>r.strategy.indexOf("control")>=0);
  const investors = rows.filter(r=>r!==control);
  if(control && investors.every(r=>r.median<=control.median))
    out.push(["bad","INVESTMENT DOESN'T PAY","Doing nothing beats every strategy that hires. Hiring is free, so the cost is all in crowding and credit burn — ease those, or raise payouts."]);

  const gap = best.median / Math.max(1, [...rows].sort((x,y)=>y.median-x.median)[1].median);
  if(gap>1.8)
    out.push(["bad","DOMINANT STRATEGY","'"+best.strategy+"' scores "+gap.toFixed(1)+"× the runner-up. One line of play is solving the game; the others aren't real choices."]);
  else
    out.push(["ok","STRATEGIES COMPETE","Best and second-best are within "+gap.toFixed(1)+"×, so play style is a real decision."]);

  if(spread<0.25)
    out.push(["warn","LOW VARIANCE","P10 to P90 spans only "+pct(spread)+" of the median. Runs feel identical, which flattens the reason to replay."]);
  if(b.stalledSeconds>60)
    out.push(["warn","CREDIT STALLS","Runs spend "+b.stalledSeconds.toFixed(0)+"s frozen at zero credits. Sickening by design, but check it isn't just tedium."]);
  if(rows.every(r=>r.debtRate<0.05))
    out.push(["warn","DEBT NEVER BITES","Almost no run ends in the red, so the whole debt ladder — interest, LOW-reasoning lock, repossession — is dead content."]);
  return out;
}

function render(rows, samples, runs){
  const b = rows[0];
  const bestMedian = Math.max(...rows.map(r=>r.median));
  const flags = diagnose(rows, cfg);
  const cps = player.cps;

  document.getElementById("out").innerHTML = `
  <div class="card">
    <h2>READ THIS FIRST</h2>
    <div class="flags">${flags.map(([k,t,p])=>
      `<div class="flag ${k}"><b>${t}</b><p>${p}</p></div>`).join("")}</div>
  </div>

  <div class="card">
    <h2>CLICK PRESSURE ACROSS THE RUN</h2>
    <div class="in">
      <p class="sub">Retries the floor demands per second, averaged over ${runs} runs of the balanced strategy, against what a ${cps.toFixed(1)}/s player can serve. Where the solid line crosses the dashed one, the game has more hands than you do.</p>
      <canvas id="c1"></canvas>
      <div class="legend">
        <span><i style="background:#A5605A"></i>DEMANDED</span>
        <span><i style="background:#5F807A"></i>SERVED</span>
        <span><i style="background:#AC9463"></i>BACKLOG (AGENTS WAITING)</span>
        <span><i style="background:#A5605A;opacity:.5"></i>PLAYER CAP</span>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>SCORE BY STRATEGY</h2>
    <div class="in">
      <p class="sub">Each scripted strategy plays ${runs} full runs on identical seeds. If one row runs away with it, the game has a solved line.</p>
      <table>
        <tr><th>STRATEGY</th><th>MEDIAN</th><th>P10</th><th>P90</th><th>DELIV</th><th>FAIL</th><th>SERVED</th><th>WAIT</th><th>ROSTER</th><th>DEBT</th></tr>
        ${rows.map(r=>`<tr class="${r.median===bestMedian?"best":""}">
          <td>${r.strategy}</td>
          <td class="${r.median<0?"neg":"m"}">${money(r.median)}</td>
          <td class="d">${money(r.p10)}</td>
          <td class="d">${money(r.p90)}</td>
          <td>${r.deliveries.toFixed(1)}</td>
          <td>${pct(r.failRate)}</td>
          <td class="${r.clickServeRate<0.8?"neg":""}">${pct(r.clickServeRate)}</td>
          <td>${r.meanBlockedWait.toFixed(1)}s</td>
          <td>${r.finalRoster.toFixed(1)}</td>
          <td class="${r.debtRate>0.3?"neg":"d"}">${pct(r.debtRate)}</td>
        </tr>`).join("")}
      </table>
    </div>
  </div>

  <div class="card">
    <h2>SCORE DISTRIBUTION · BALANCED</h2>
    <div class="in">
      <p class="sub">Every run, sorted. A wall means the run always ends the same way; a long tail means skill and luck both have somewhere to go.</p>
      <canvas id="c2"></canvas>
    </div>
  </div>

  <div class="card">
    <h2>CASH ACROSS THE RUN</h2>
    <div class="in">
      <p class="sub">Mean cash on hand. The intended shape is build, keep pace, harvest — spending down to nothing before the buzzer, since leftover credits score zero.</p>
      <canvas id="c3"></canvas>
    </div>
  </div>

  <div class="card">
    <h2>DIAGNOSTICS · BALANCED</h2>
    <div class="tiles">
      <div class="tile ${b.clickServeRate<0.8?"warn":"good"}"><b>CLICKS SERVED</b><i>${pct(b.clickServeRate)}</i><s>of what the floor demanded</s></div>
      <div class="tile"><b>PEAK DEMAND</b><i>${Math.max(...b.demandCurve).toFixed(2)}/s</i><s>against a ${cps.toFixed(1)}/s player</s></div>
      <div class="tile"><b>MEAN WAIT</b><i>${b.meanBlockedWait.toFixed(1)}s</i><s>an agent sits blocked</s></div>
      <div class="tile"><b>PEAK BACKLOG</b><i>${Math.max(...b.backlogCurve).toFixed(1)}</i><s>agents queued at once</s></div>
      <div class="tile"><b>DELIVERIES</b><i>${b.deliveries.toFixed(1)}</i><s>projects banked per run</s></div>
      <div class="tile"><b>FAILED RUNS</b><i>${pct(b.failRate)}</i><s>resolve red</s></div>
      <div class="tile ${b.stalledSeconds>60?"warn":""}"><b>STALLED</b><i>${b.stalledSeconds.toFixed(0)}s</i><s>frozen at zero credits</s></div>
      <div class="tile ${b.repossessions>0?"warn":""}"><b>REPOSSESSED</b><i>${b.repossessions.toFixed(1)}</i><s>agents lost to debt</s></div>
      <div class="tile"><b>SPREAD</b><i>${b.spread.toFixed(2)}×</i><s>P10 to P90 over median</s></div>
    </div>
  </div>`;

  chart(document.getElementById("c1"), [
    {data:b.backlogCurve, color:"#AC9463", fill:"rgba(172,148,99,.10)", width:1.2},
    {data:b.servedCurve, color:"#5F807A"},
    {data:b.demandCurve, color:"#A5605A", width:2},
  ], {height:210, threshold:cps, thresholdLabel:"YOUR HANDS",
      fmtY:v=>v.toFixed(1), xLeft:"0 min", xRight:(cfg.runSeconds/60)+" min"});

  histogram(document.getElementById("c2"), samples, {height:170});

  chart(document.getElementById("c3"), [
    {data:b.cashCurve, color:"#78906C", fill:"rgba(120,144,108,.12)", width:2},
  ], {height:170, fmtY:v=>"$"+Math.round(v/1000)+"k",
      xLeft:"0 min", xRight:(cfg.runSeconds/60)+" min"});
}

document.getElementById("go").onclick = run;
document.getElementById("reset").onclick = () => {
  cfg = S.cloneConfig(S.DEFAULT_CONFIG); player={cps:2.5,reaction:0.35}; buildLevers();
};
document.getElementById("copy").onclick = async () => {
  const txt = JSON.stringify({config:cfg, player}, null, 2);
  try { await navigator.clipboard.writeText(txt); }
  catch { const t=document.createElement("textarea"); t.value=txt; document.body.appendChild(t);
    t.select(); document.execCommand("copy"); t.remove(); }
  const btn=document.getElementById("copy"); btn.textContent="COPIED";
  setTimeout(()=>btn.textContent="COPY CONFIG",1400);
};
window.addEventListener("resize", () => {
  const c1=document.getElementById("c1"); if(c1) run.lastRender && run.lastRender();
});
</script>
</body>
</html>
